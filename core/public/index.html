<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BidBy</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; background: #fafafa; color: #111; }
    h1 { margin: 0 0 4px; }
    #status { color: #666; margin-bottom: 16px; }
    #feed { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, monospace; font-size: 13px; }
    #feed li { padding: 6px 8px; border-bottom: 1px solid #e5e5e5; }
    .at { color: #888; margin-right: 8px; }
    .type { font-weight: 600; margin-right: 8px; }
    .payload { color: #444; word-break: break-all; }
    #call { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; background: #111; color: #fff; }
    #call.on { display: block; }
    #call .state { font-weight: 600; }
    #call ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: #ddd; }
  </style>
</head>
<body>
  <!-- Bare event feed (spec 00). The full judge view is spec 07. -->
  <h1>BidBy</h1>
  <div id="status">connecting…</div>
  <!-- Call card (spec 06): BidBy calling the user, and each voice tool call live. -->
  <div id="call"><div class="state"></div><ul></ul></div>
  <ul id="feed"></ul>

  <script>
    const feed = document.getElementById("feed");
    const status = document.getElementById("status");
    const seen = new Set();
    const callCard = document.getElementById("call");

    const CALL_STATES = {
      "call.ringing": (p) => `📞 BidBy is calling about ${p.title} (${p.amount}, due ${p.deadline})…`,
      "call.started": (p) => p.provider === "browser" ? null : `📞 Call started (${p.provider})`,
      "call.answered": () => "📞 In call",
      "call.completed": (p) => `✅ Call ended: ${p.summary || "no summary"}`,
      "call.failed": (p) => `❌ Call not connected (${p.failure_reason ?? p.message ?? "failed"})`,
      "call.refused": () => "⛔ Call refused: number not on ALLOWED_DIAL_NUMBERS",
      "call.manual_needed": (p) => `☎️ Start the call from the ElevenLabs dashboard: ${JSON.stringify(p.dynamic_variables)}`,
    };

    function renderCall(e) {
      if (e.type === "call.ringing" || e.type === "call.manual_needed" || (e.type === "call.started" && e.payload.provider !== "browser")) {
        callCard.querySelector("ul").replaceChildren();
      }
      const state = CALL_STATES[e.type]?.(e.payload);
      if (state) {
        callCard.querySelector(".state").textContent = state;
        callCard.classList.add("on");
      }
      if (e.type === "voice.tool_called") {
        const li = document.createElement("li");
        const { tool, ...args } = e.payload;
        li.textContent = `${tool} ${JSON.stringify(args)}`;
        callCard.querySelector("ul").append(li);
        callCard.classList.add("on");
      }
    }

    function render(e) {
      const li = document.createElement("li");
      for (const [cls, text] of [["at", e.at], ["type", e.type], ["payload", JSON.stringify(e.payload)]]) {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = text;
        li.append(span);
      }
      feed.prepend(li);
    }

    const source = new EventSource("/api/events");
    source.onopen = () => { status.textContent = "live"; };
    source.onerror = () => { status.textContent = "disconnected — retrying…"; };
    source.onmessage = (msg) => {
      const e = JSON.parse(msg.data);
      if (seen.has(e.id)) return; // replayed on reconnect
      seen.add(e.id);
      if (e.type === "demo.reset") { feed.replaceChildren(); callCard.classList.remove("on"); }
      render(e);
      renderCall(e);
    };
  </script>
</body>
</html>
